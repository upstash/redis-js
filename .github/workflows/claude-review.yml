name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

jobs:
  review:
    name: Claude review
    # Fork PRs get no secrets, and bot PRs and bot-triggered events (dependabot, changesets) are skipped.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      # Public repo: only comments from people with write access, and installed bots, reach the reviewer.
      - name: Fetch the PR for the reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          ok=$(
            for e in issues/$PR/comments pulls/$PR/reviews pulls/$PR/comments; do
              gh api "repos/$GITHUB_REPOSITORY/$e" --paginate --jq '.[].user | select(.type == "User") | .login'
            done | sort -u | while read -r u; do
              case $(gh api "repos/$GITHUB_REPOSITORY/collaborators/$u/permission" --jq .permission 2>/dev/null) in admin | write) printf '"%s",' "$u" ;; esac
            done
          )
          trusted="select(.user.type == \"Bot\" or (.user.login as \$l | [${ok%,}] | any(. == \$l)))"
          {
            gh pr view "$PR" -R "$GITHUB_REPOSITORY"
            printf '\n## Comments\n'
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | $trusted | \"\n### \(.user.login)\n\(.body)\""
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq ".[] | $trusted | select(.body != \"\") | \"\n### \(.user.login) (review)\n\(.body)\""
          } > pr.md
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" --paginate --jq ".[] | $trusted | {user: .user.login, path, line, body}" > review-comments.jsonl
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" -H "Accept: application/vnd.github.diff" > pr.diff ||
            { echo "The diff is too large to fetch. Changed files:"; gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'; } > pr.diff

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review pull request ${{ github.repository }}#${{ github.event.pull_request.number }}. The repository is checked out at the PR's head. In ${{ runner.temp }}/pr are the PR's title, description and comments (`pr.md`), its diff (`pr.diff`), and its earlier inline review comments (`review-comments.jsonl`). The checkout and the diff are at commit ${{ github.event.pull_request.head.sha }}.

            1. Spawn a fresh `bug-finder` subagent. Give it the diff path, the PR's goal from its title and description, and the conditions the change runs under (runtimes, data shapes, missing config), not your reasoning. Present it as another author's work, and don't tell it there are bugs. Ask it for bugs this diff introduces, and to work through these after its first read:
               - Failure paths: every new call to a network, API, storage, or another module that can fail or throw. What state is left behind when it does?
               - Concurrent writes: data that two flows write at once (parallel requests, retries, pipelines), and read-modify-write of whole records.
               - Where it runs: Node, edge, browser, and serverless runtimes, and missing env vars.
               - Contracts with other systems: commands, arguments, request and response shapes, and headers the Upstash Redis REST API expects.
               - Siblings: other callers of the changed code, and the pipeline, auto-pipeline, and other entry points that share it.

               Old code that this diff newly makes reachable counts as introduced. Each finding: file:line, the concrete input or scenario that breaks, severity, and a 0-100 confidence. "Nothing found" is a valid answer.
            2. Check each finding yourself in the code. Drop a finding only if you can show it's wrong, it was already broken before this PR and the PR doesn't newly expose it, it's style, or an earlier review comment on this PR already raised it. Keep low-severity bugs that users would see. When a finding depends on something you can't check (runtime, data, infra), keep it as a question that says what would confirm it.
            3. Post each kept finding with `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`, `commit_id: ${{ github.event.pull_request.head.sha }}`) on a RIGHT-side line inside a diff hunk, the closest one to the problem. For a bug: its severity, the scenario that breaks, and the fix; use a suggestion block only when committing it fixes the issue entirely. For a question: start with "Question:", then say what breaks if the assumption is wrong and what would confirm it. With no kept findings, post nothing.
          claude_args: |
            --model claude-opus-5-5
            --add-dir ${{ runner.temp }}/pr
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Read(./.git/**)"
            --agents '{"bug-finder":{"description":"Finds bugs a pull request introduces and reports them; posts nothing.","prompt":"You review a pull request by another author and report findings to the agent that asked. You cannot post to GitHub.","tools":["Read","Grep","Glob"],"model":"opus"}}'
